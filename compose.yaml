name: rails-sass-development

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: rails_sass_development
      POSTGRES_PASSWORD: rails_sass
      POSTGRES_USER: rails_sass
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailcatcher:
    image: sj26/mailcatcher:v0.10.0@sha256:5d153a4daadf0c266f29c3856085741f06ca1e3768671f4267622d3e3ffe5564
    command: [ "--ip", "0.0.0.0", "--messages-limit", "100", "--no-quit" ]
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILCATCHER_HTTP_PORT:-1080}:1080"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:1080/" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: "${LOCAL_UID:-1000}"
        GROUP_ID: "${LOCAL_GID:-1000}"
    command: bin/dev
    depends_on:
      mailcatcher:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_HOST: "${APP_HOST:-localhost}"
      APP_PORT: "${PORT:-3000}"
      BINDING: 0.0.0.0
      FOREMAN_ENV: /dev/null
      LEMON_SQUEEZY_API_KEY: "${LEMON_SQUEEZY_API_KEY:-}"
      LEMON_SQUEEZY_STORE_ID: "${LEMON_SQUEEZY_STORE_ID:-}"
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: rails_sass
      PGPASSWORD: rails_sass
      PORT: 3000
      SMTP_ADDRESS: mailcatcher
      SMTP_PORT: 1025
      TEST_WORKERS: "${TEST_WORKERS:-1}"
    init: true
    ports:
      - "${PORT:-3000}:3000"
    shm_size: 256mb
    stdin_open: true
    tty: true
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle

volumes:
  bundle_data:
  postgres_data:
