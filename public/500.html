<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Server error (500)</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f1f5f9; color: #0f172a; font: 1rem/1.6 ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100%, 36rem); padding: 3rem; border: 1px solid #e2e8f0; border-radius: 1.5rem; background: #fff; text-align: center; box-shadow: 0 1px 3px rgb(15 23 42 / 0.08); }
      p:first-child { margin: 0; color: #4f46e5; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: .75rem 0; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.1; }
      p { color: #475569; }
      a { color: #4338ca; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p>Error 500</p>
      <h1>Something went wrong</h1>
      <p>The server could not complete the request. Please try again.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
